name: Build Madrasa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          mkdir project
          unzip -q MadrasaApp_Android_Project-*.zip -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -50

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: project/MadrasaApp_Android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madrasa-App-APK
          path: project/MadrasaApp_Android/app/build/outputs/apk/debug/app-debug.apk
